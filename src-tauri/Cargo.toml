[package]
name = "konco-nembang"
version = "0.1.0"
description = "Transparent, click-through synced lyrics overlay"
authors = ["Konco Nembang contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "konco_nembang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Schannel (native-tls) avoids needing a C toolchain for a TLS library on Windows.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Same Schannel TLS as the LRCLIB client; NSIS updates need no zip support.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
# Same version Tauri already pulls in, so it is not compiled twice.
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Win32_System_WinRT"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
