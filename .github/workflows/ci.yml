name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # Also produces dist/, which the Rust build embeds.
      - name: Type-check and build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
